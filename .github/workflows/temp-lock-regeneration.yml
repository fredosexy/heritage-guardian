name: Temporary dependency lock regeneration

on:
  push:
    branches: ["codex/phase-1-session-security-mainline"]

permissions:
  contents: write

jobs:
  regenerate-lock:
    if: contains(github.event.head_commit.message, 'prepare dependency lock')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile and audit
        run: |
          npm install -g npm@11
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
          npm audit --json > audit-report.json || true
          node -e "const a=require('./audit-report.json'); console.log('AUDIT_COUNTS', JSON.stringify(a.metadata?.vulnerabilities)); console.log('AUDIT_HIGH', Object.values(a.vulnerabilities||{}).filter(v=>v.severity==='high'||v.severity==='critical').map(v=>({name:v.name,severity:v.severity,fixAvailable:v.fixAvailable})))"
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git commit -m "chore(deps): regenerate lockfile for security updates"
          git push

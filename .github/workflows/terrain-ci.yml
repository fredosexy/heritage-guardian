name: Terrain CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/terrain-module-foundation

permissions:
  contents: read

concurrency:
  group: terrain-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run ESLint
        run: npm run lint
      - name: Run Vitest
        run: npm test
      - name: Build application
        run: npm run build

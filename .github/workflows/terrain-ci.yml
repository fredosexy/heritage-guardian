name: Terrain CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/terrain-module-foundation

permissions:
  contents: read

concurrency:
  group: terrain-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run Vitest
        run: bun run test
      - name: Run ESLint
        run: bun run lint
      - name: Build application
        run: bun run build

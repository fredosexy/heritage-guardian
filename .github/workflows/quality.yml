name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "codex/phase-1-session-security-mainline"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Temporary dependency audit
        run: npm audit --json || true
      - run: npm test
      - run: npm run lint
      - run: npm run build

name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "codex/phase-1-session-security-mainline"]

permissions:
  contents: read

jobs:
  database-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Start isolated local Supabase stack
        run: supabase start
      - name: Apply every migration to a fresh local database
        run: supabase db reset --local
      - name: Run database security and regression tests
        run: supabase test db --local
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        id: install-dependencies
        run: npm ci
      - run: npm test
      - run: npm run lint
      # Keep build diagnostics available even when lint or tests fail, provided
      # dependencies were installed successfully.
      - name: Run production build
        if: always() && steps.install-dependencies.outcome == 'success'
        run: npm run build

  edge-integration:
    runs-on: ubuntu-latest
    needs: database-migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Start isolated local Supabase stack
        run: supabase start
      - name: Reset database and prepare local Edge environment
        shell: bash
        run: |
          set -euo pipefail
          supabase db reset --local
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          {
            printf 'SUPABASE_URL="%s"\n' "$SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY="%s"\n' "$SUPABASE_ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY="%s"\n' "$SUPABASE_SERVICE_ROLE_KEY"
          } > /tmp/heritis-edge-test.env
      - name: Serve Edge functions in the local Supabase runtime
        run: |
          supabase functions serve --env-file /tmp/heritis-edge-test.env > /tmp/heritis-edge-functions.log 2>&1 &
          echo $! > /tmp/heritis-edge-functions.pid
      - name: Wait for local Edge runtime
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' --request OPTIONS http://127.0.0.1:54321/functions/v1/ai-chat || true)"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/heritis-edge-functions.log
          exit 1
      - name: Test Edge authentication, RLS access and rate limits
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" node scripts/test-ai-edge-integration.mjs
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup

name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "codex/phase-1-session-security-mainline"]

permissions:
  contents: read

jobs:
  database-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      # The setup action pins the registry to GHCR; clear that override so the CLI
      # can fall back across registries if a shared runner is rate-limited.
      - name: Enable Supabase registry fallbacks
        run: echo 'SUPABASE_INTERNAL_IMAGE_REGISTRY=' >> "$GITHUB_ENV"
      - name: Start isolated local Supabase stack
        run: supabase start
      - name: Apply every migration to a fresh local database
        run: supabase db reset --local
      - name: Run database security and regression tests
        run: supabase test db --local
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        id: install-dependencies
        run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run lint
      # Keep build diagnostics available even when lint or tests fail, provided
      # dependencies were installed successfully.
      - name: Run production build
        if: always() && steps.install-dependencies.outcome == 'success'
        run: bun run build

  edge-integration:
    runs-on: ubuntu-latest
    needs: database-migrations
    # Keep Edge integration isolated from the default PostgreSQL port used by
    # other local Supabase stacks on shared/self-hosted runners.
    env:
      SUPABASE_DB_PORT: 55432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      # Clear setup-cli's GHCR override to allow cross-registry fallback.
      - name: Enable Supabase registry fallbacks
        run: echo 'SUPABASE_INTERNAL_IMAGE_REGISTRY=' >> "$GITHUB_ENV"
      - name: Clean up stale local Supabase containers and inspect the database port
        shell: bash
        run: |
          set -euo pipefail
          # A previous or partially initialized local stack must not retain
          # Supabase's default database port on this runner.
          supabase stop --no-backup || true
          if ss -ltnp | grep -q ':55432'; then
            echo "Port 55432 is still occupied after Supabase cleanup:"
            ss -ltnp | grep ':55432' || true
            echo "Docker containers publishing port 55432:"
            docker ps --filter publish=55432 --format '{{.ID}} {{.Names}} {{.Ports}}' || true
            exit 1
          fi
      - name: Start isolated local Supabase stack
        run: supabase start
      - name: Reset database and prepare local Edge environment
        shell: bash
        run: |
          set -euo pipefail
          supabase db reset --local
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          {
            printf 'SUPABASE_URL="%s"\n' "$SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY="%s"\n' "$SUPABASE_ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY="%s"\n' "$SUPABASE_SERVICE_ROLE_KEY"
          } > /tmp/heritis-edge-test.env
      - name: Run Edge integration tests
        shell: bash
        run: |
          set -euo pipefail
          supabase functions serve --env-file /tmp/heritis-edge-test.env > /tmp/heritis-edge-functions.log 2>&1 &
          edge_pid=$!
          trap 'kill "$edge_pid" 2>/dev/null || true' EXIT

          edge_ready=false
          auth_ready=false
          for attempt in $(seq 1 90); do
            if ! kill -0 "$edge_pid" 2>/dev/null; then
              echo "Supabase Edge server exited before becoming ready."
              cat /tmp/heritis-edge-functions.log
              exit 1
            fi

            edge_code="$(curl --silent --output /dev/null --write-out '%{http_code}' --request OPTIONS \
              --header 'Origin: http://localhost:3000' \
              --header 'Access-Control-Request-Method: POST' \
              http://127.0.0.1:54321/functions/v1/ai-chat || true)"
            auth_code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:54321/auth/v1/health || true)"

            if [ "$edge_code" = "200" ]; then edge_ready=true; fi
            if [ "$auth_code" = "200" ]; then auth_ready=true; fi
            if [ "$edge_ready" = "true" ] && [ "$auth_ready" = "true" ]; then
              break
            fi
            sleep 2
          done

          if [ "$edge_ready" != "true" ] || [ "$auth_ready" != "true" ]; then
            echo "Local Supabase APIs did not become ready within 180 seconds (Edge HTTP: ${edge_code:-none}; Auth HTTP: ${auth_code:-none})."
            echo "Supabase Edge runtime logs:"
            cat /tmp/heritis-edge-functions.log
            exit 1
          fi

          eval "$(supabase status -o env)"
          if ! SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" node scripts/test-ai-edge-integration.mjs; then
            echo "Edge integration tests failed; dumping Supabase Edge runtime logs:"
            cat /tmp/heritis-edge-functions.log
            exit 1
          fi
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup

name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "codex/phase-1-session-security-mainline"]

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  database-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Start isolated local Supabase stack
        run: supabase start
      - name: Apply every migration to a fresh local database
        run: supabase db reset --local
      - name: Run database security and regression tests
        run: supabase test db --local
      - name: Prepare local Edge environment
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          {
            printf 'SUPABASE_URL="%s"\n' "$SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY="%s"\n' "$SUPABASE_ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY="%s"\n' "$SUPABASE_SERVICE_ROLE_KEY"
          } > /tmp/heritis-edge-test.env
      - name: Run Edge integration tests
        shell: bash
        run: |
          set -euo pipefail
          supabase functions serve --env-file /tmp/heritis-edge-test.env > /tmp/heritis-edge-functions.log 2>&1 &
          edge_pid=$!
          trap 'kill "$edge_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in $(seq 1 90); do
            if ! kill -0 "$edge_pid" 2>/dev/null; then
              echo "Supabase Edge server exited before becoming ready."
              cat /tmp/heritis-edge-functions.log
              exit 1
            fi
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' --request OPTIONS \
              --header 'Origin: http://localhost:3000' \
              --header 'Access-Control-Request-Method: POST' \
              http://127.0.0.1:54321/functions/v1/ai-chat || true)"
            if [ "$code" = "200" ]; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != "true" ]; then
            echo "Supabase Edge runtime did not become ready within 180 seconds (last HTTP status: ${code:-none})."
            cat /tmp/heritis-edge-functions.log
            exit 1
          fi

          eval "$(supabase status -o env)"
          if ! SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" node scripts/test-ai-edge-integration.mjs; then
            echo "Edge integration tests failed; dumping Supabase Edge runtime logs:"
            cat /tmp/heritis-edge-functions.log
            exit 1
          fi
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        id: install-dependencies
        run: npm ci
      - run: npm test
      - run: npm run lint
      # Keep build diagnostics available even when lint or tests fail, provided
      # dependencies were installed successfully.
      - name: Run production build
        if: always() && steps.install-dependencies.outcome == 'success'
        run: npm run build

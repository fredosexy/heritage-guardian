name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "codex/phase-1-session-security-mainline"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Temporary dependency audit
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const a=require("/tmp/npm-audit.json"); const vs=a.vulnerabilities||{}; console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, packages:Object.entries(vs).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,via:(v.via||[]).map(x=>typeof x==="string"?x:{name:x.name,title:x.title,url:x.url,range:x.range,severity:x.severity}),effects:v.effects,fixAvailable:v.fixAvailable,nodes:v.nodes}))},null,2))'
      - run: npm test
      - run: npm run lint
      - run: npm run build

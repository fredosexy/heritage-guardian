name: Bun lock validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - codex/phase-1-heritage-premium-design-system

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install from committed Bun lockfile
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test
      - name: Run lint
        run: bun run lint
      - name: Build
        run: bun run build
